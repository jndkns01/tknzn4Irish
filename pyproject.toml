[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "criochscore"
version = "0.1.0"
description = "Score subword tokenizers on how well they respect Irish morpheme boundaries."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy==1.26.4",
    "tokenizers",
    "sentencepiece",
]

[project.optional-dependencies]
english-filter = [
    "fasttext",
    "huggingface_hub",
]
huggingface = [
    "transformers",
]
dev = [
    "pytest",
]

[project.scripts]
criochscore = "criochscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
criochscore = []
